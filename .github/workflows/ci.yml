name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libftxui-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake ftxui

      - name: Configure
        working-directory: ./build
        run: cmake -DCMAKE_BUILD_TYPE=Release .. || (mkdir -p build && cd build && cmake -DCMAKE_BUILD_TYPE=Release ..)

      - name: Build
        working-directory: ./build
        run: make -j$(nproc)