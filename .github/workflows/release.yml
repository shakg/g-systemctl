name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Get version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    # Build against an old glibc so the binary and .deb run on Ubuntu 22.04+ and Debian 12+.
    container: ubuntu:22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git cmake make g++ dpkg-dev file

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DG_SYSTEMCTL_VERSION="$VERSION"
          cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          mkdir -p "dist/g-systemctl-$VERSION"
          install -m 755 build/g-systemctl "dist/g-systemctl-$VERSION/g-systemctl"
          tar -czf dist/g-systemctl-linux-x86_64.tar.gz -C dist "g-systemctl-$VERSION"
          rm -rf "dist/g-systemctl-$VERSION"

          (cd build && cpack -G DEB)
          cp build/*.deb dist/g-systemctl-linux-amd64.deb

      - name: Verify packages install the way the README says
        shell: bash
        run: |
          set -x
          dpkg-deb -I dist/g-systemctl-linux-amd64.deb
          dpkg-deb -c dist/g-systemctl-linux-amd64.deb
          apt-get install -y ./dist/g-systemctl-linux-amd64.deb
          g-systemctl --version | grep -F "$VERSION"
          apt-get remove -y g-systemctl

          tmp="$(mktemp -d)"
          tar -xzf dist/g-systemctl-linux-x86_64.tar.gz -C "$tmp"
          install -m 755 "$tmp"/g-systemctl-*/g-systemctl /usr/local/bin/g-systemctl
          g-systemctl --version | grep -F "$VERSION"

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS-linux-x86_64.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: g-systemctl-linux-x86_64
          path: dist/*
          if-no-files-found: error

  build-macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DG_SYSTEMCTL_VERSION="$VERSION"
          cmake --build build --config Release --parallel

      - name: Package
        run: |
          mkdir -p "dist/g-systemctl-$VERSION"
          install -m 755 build/g-systemctl "dist/g-systemctl-$VERSION/g-systemctl"
          tar -czf dist/g-systemctl-macos.tar.gz -C dist "g-systemctl-$VERSION"
          rm -rf "dist/g-systemctl-$VERSION"
          "build/g-systemctl" --version | grep -F "$VERSION"

      - name: Generate checksums
        run: cd dist && shasum -a 256 * > SHA256SUMS-macos.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: g-systemctl-macos
          path: dist/*
          if-no-files-found: error

  create-release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Homebrew formula
        run: |
          source_url="https://github.com/${GH_REPO}/archive/refs/tags/${TAG}.tar.gz"
          source_sha="$(curl -fsSL "$source_url" | sha256sum | awk '{print $1}')"
          sed \
            -e "s|refs/tags/v1.0.0.tar.gz|refs/tags/${TAG}.tar.gz|" \
            -e "s|REPLACE_WITH_RELEASE_TARBALL_SHA256|${source_sha}|" \
            Formula/g-systemctl.rb > artifacts/g-systemctl.rb

      - name: Generate combined checksums
        run: |
          cd artifacts
          sha256sum g-systemctl-linux-x86_64.tar.gz g-systemctl-macos.tar.gz g-systemctl-linux-amd64.deb g-systemctl.rb > SHA256SUMS.txt

      # Works whether or not a release for this tag was already created by hand.
      - name: Create or update release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Release $TAG" --generate-notes
          fi
          gh release upload "$TAG" --clobber \
            artifacts/g-systemctl-linux-x86_64.tar.gz \
            artifacts/g-systemctl-macos.tar.gz \
            artifacts/g-systemctl-linux-amd64.deb \
            artifacts/g-systemctl.rb \
            artifacts/SHA256SUMS.txt \
            artifacts/SHA256SUMS-linux-x86_64.txt \
            artifacts/SHA256SUMS-macos.txt
